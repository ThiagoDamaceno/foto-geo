<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fallback estático: <dir> relativo a este arquivo. Em runtime o Main gera
     uma conf em userData com caminhos absolutos (cache gravável). -->
<fontconfig>
  <dir>.</dir>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Roboto</family></prefer>
  </alias>
</fontconfig>
